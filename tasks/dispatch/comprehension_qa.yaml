# Codebase-comprehension Q&A for a fork of Netflix/dispatch.
# Answer key verified against the actual source (June 2026, main).
# Grading: answer must contain all `must_contain` terms, or any of `accept_any`.
id: dispatch-qa
type: qa
questions_per_session: 5
questions:
  - q: "Which file creates the main FastAPI application instance(s)?"
    must_contain: ["main.py"]
  - q: "What ORM does the backend use, and in which package directory is the database session/engine setup code?"
    must_contain: ["sqlalchemy", "database"]
  - q: "Where (directory path) is the Slack plugin implemented?"
    must_contain: ["plugins", "dispatch_slack"]
  - q: "In which file is the service-layer function that creates a new incident defined?"
    must_contain: ["incident", "service.py"]
  - q: "How is application configuration loaded? Name the file and the mechanism/library."
    must_contain: ["config.py", "starlette"]
  - q: "Where is the background scheduler class defined?"
    must_contain: ["scheduler.py"]
  - q: "What frontend framework does Dispatch use and where does the frontend code live?"
    must_contain: ["vue", "static/dispatch"]
  - q: "What tool manages database migrations and where are the migration revision files stored?"
    must_contain: ["alembic", "revisions"]
  - q: "What test framework is used for the backend test suite?"
    accept_any: ["pytest"]
  - q: "Name the directory that contains the base classes for the plugin framework."
    must_contain: ["plugins", "base"]
  # Harder multi-hop questions (require tracing across files, not just locating one).
  - q: "When an incident is created via the REST API, the heavy lifting happens asynchronously. Name the flow function that gets dispatched and the FastAPI mechanism used to run it after the response is sent."
    must_contain: ["incident_create_flow", "background"]
  - q: "Which single function dispatches the transition logic when an incident's status changes (e.g. Active -> Stable -> Closed), and in which file is it defined?"
    must_contain: ["status_flow_dispatcher", "flows.py"]
  - q: "There is a scheduled task that reminds commanders to close incidents. What is its registered task name, and at what time of day does it run?"
    must_contain: ["incident-close-reminder", "18:00"]
